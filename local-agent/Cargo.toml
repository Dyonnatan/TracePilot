[package]
name = "tracepilot-local-agent"
version = "0.1.0"
edition = "2021"
description = "Agente leve instalado na máquina monitorada: coleta recursos do sistema (CPU, memória, disco) e exporta via OTLP para o pipeline do TracePilot."

[[bin]]
name = "tracepilot-agent"
path = "src/main.rs"

[dependencies]
sysinfo = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["metrics", "grpc-tonic"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"   # otimiza pra tamanho do binário, não velocidade — minimiza footprint
lto = true
strip = true
