{% extends "onboarding_base.html" %}
{% block title %}Análise · TracePilot{% endblock %}
{% block step %}
<h1>Analisando o servidor</h1>
<p class="lead">Identificando a máquina, o sistema e a segurança.</p>
<div class="scan-bar"><div data-scan-bar></div></div>
<p class="scan-status" data-scan-label>iniciando</p>
<ul class="scan" data-scan>
  {% for r in rows %}
  <li class="{{ 'is-warn' if r.warn }}"><span class="s"></span><span class="k">{{ r.label }}</span><span class="v"><span class="pending">…</span><span class="result">{{ r.value }}</span></span></li>
  {% endfor %}
</ul>
<div class="actions"><a href="/onboarding/summary" class="btn btn-lg hidden" id="continue-link">Ver resumo</a></div>
<noscript><style>.scan li{opacity:1}.scan .pending{display:none}.scan .result{display:inline}#continue-link{display:inline-flex!important}</style></noscript>
<script>
  (function () {
    const items = Array.from(document.querySelectorAll('[data-scan] li'));
    const bar = document.querySelector('[data-scan-bar]');
    const label = document.querySelector('[data-scan-label]');
    let i = 0;
    function next() {
      if (i > 0) items[i - 1].classList.replace('is-running', 'is-done');
      if (i === items.length) {
        bar.style.width = '100%';
        label.textContent = 'concluído · abrindo o resumo';
        document.getElementById('continue-link').classList.remove('hidden');
        // Avança sozinho; o botão fica para quem quiser ir antes.
        setTimeout(() => { window.location.href = '/onboarding/summary'; }, 1400);
        return;
      }
      items[i].classList.add('is-visible', 'is-running');
      label.textContent = items[i].querySelector('.k').textContent.toLowerCase() + '…';
      bar.style.width = `${(i / items.length) * 100}%`;
      i += 1;
      setTimeout(next, 380 + Math.random() * 250);
    }
    next();
  })();
</script>
{% endblock %}
