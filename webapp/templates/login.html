{% extends "base_marketing.html" %}
{% block title %}Entrar · TracePilot{% endblock %}
{% block content %}
<section class="auth">
  <h1>Entrar</h1>
  <form method="post" action="/login" class="form">
    <label class="field"><span>E-mail</span>
      <input type="email" name="email" value="{{ prefill_email }}" autocomplete="username" required {{ '' if prefill_email else 'autofocus' }}>
    </label>
    <label class="field"><span>Senha</span>
      <input type="password" name="password" value="{{ prefill_password }}" autocomplete="{{ 'new-password' if first_access else 'current-password' }}" required {{ 'autofocus' if prefill_email and not prefill_password }}>
    </label>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <button type="submit">Entrar</button>
  </form>
  {% if first_access %}<p class="auth-foot">Primeiro acesso: a senha digitada vira a sua.</p>{% endif %}
</section>
{% endblock %}
