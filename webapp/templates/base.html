<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TracePilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% set user = current_user(request) %}
  <header class="topbar">
    <a href="{{ '/dashboard' if user else '/' }}" class="brand">🛰️ TracePilot</a>
    <span class="tagline">monitoramento que explica em português</span>
    {% if user %}
    <div class="topbar-user">
      <span class="topbar-user-name">{{ user.name }}</span>
      <form method="post" action="/logout" class="topbar-logout">
        <button type="submit" class="link-button">Sair</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="{% block container_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
