{% import "_brand.html" as brand %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  {{ brand.head() }}
  <title>{% block title %}TracePilot{% endblock %}</title>
</head>
<body>
  {% set user = current_user(request) %}
  <header class="topbar">
    <a href="{{ '/dashboard' if user else '/' }}" class="brand">{{ brand.logo() }}TracePilot</a>
    <div class="topbar-right">
      {% if user %}
      <span class="topbar-user">{{ user.email }}</span>
      <form method="post" action="/logout"><button type="submit" class="link-button">Sair</button></form>
      {% endif %}
      {{ brand.theme_toggle() }}
    </div>
  </header>
  <main class="{% block container_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
