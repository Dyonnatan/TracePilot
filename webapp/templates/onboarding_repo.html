{% extends "onboarding_base.html" %}
{% block title %}Repositório · TracePilot{% endblock %}
{% block step %}
<h1>Repositório</h1>
<p class="lead">Opcional. Com o código, o TracePilot identifica as tecnologias.</p>
<form method="post" action="/onboarding/repo" class="form">
  <label class="field"><span>Link do GitHub</span>
    <input type="url" name="repo_url" value="{{ form.repo_url or '' }}" placeholder="https://github.com/sua-conta/seu-repo">
  </label>
  <div class="actions">
    <button type="submit" class="btn-lg">Continuar</button>
    <button type="submit" class="btn-line btn-lg" name="skip" value="1" formnovalidate onclick="this.form.repo_url.value=''">Pular</button>
  </div>
</form>
{% endblock %}
